<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="Bellwether — market intelligence for US equities: filings, policy and news, tied to your holdings, with the evidence attached." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c83ff'/%3E%3Cpath d='M16 7.5c-3.8 0-6.2 2.9-6.2 6.7v4.6l-2 3.2h16.4l-2-3.2v-4.6c0-3.8-2.4-6.7-6.2-6.7z' fill='%230a0b10'/%3E%3Ccircle cx='16' cy='24.8' r='1.9' fill='%230a0b10'/%3E%3C/svg%3E" />
    <title>Bellwether</title>
    <script>
      // Applied before first paint. Dark is the default and stamps nothing;
      // "light" and "system" are stamped on <html>.
      try {
        var t = localStorage.getItem("bellwether.theme");
        if (t === "light" || t === "system") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
