name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. Open /news
        2. Filter by …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail 200 tradesys`. Remove any keys or hostnames first."
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: git rev-parse --short HEAD
  - type: dropdown
    id: deploy
    attributes:
      label: How you run it
      options: [Docker Compose, Binary + own Postgres, Other]
